services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payledger
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 3s
      retries: 30
    volumes: [mysql-data:/var/lib/mysql]

  app:
    build: .
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/payledger
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
    ports: ["4000:4000"]
    depends_on:
      mysql: { condition: service_healthy }

volumes:
  mysql-data:
