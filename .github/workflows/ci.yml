name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: payledger_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (unit + API + concurrency, against real MySQL)
        run: npm test
        env:
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/payledger_test
      - name: Race-condition demo
        run: npm run race-demo
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/payledger_test
          JWT_SECRET: ci
      - name: Build frontend
        run: npm --prefix web ci && npm run build
