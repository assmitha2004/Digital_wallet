name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: payledger_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (unit + API + security + concurrency, against real MySQL)
        run: npm test
        env:
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/payledger_test
      - name: Migrations are re-runnable
        run: npm run migrate && npm run migrate
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/payledger_ci
      - name: Race-condition demo
        run: npm run race-demo
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/payledger_test
          JWT_SECRET: ci
      - name: Readiness with Redis
        run: |
          npm run seed
          node server/src/server.js &
          sleep 3
          curl -sf http://127.0.0.1:4000/api/ready | tee /dev/stderr | grep -q '"redis":{"ok":true}'
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/payledger_ci
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci
      - name: Build frontend
        run: npm --prefix web ci && npm run build
